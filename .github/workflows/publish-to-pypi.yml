# PYCUI publish: a version tag is the release. The sdist is built and checked
# first, then a wheel for every supported platform and Python is built and
# tested, and the whole set is uploaded to PyPI in one step.
#
#   git tag v1.4.0.0 && git push origin v1.4.0.0
#
# The version in pyproject.toml is <cui version>.<bindings revision>, so a tag
# must match it, and its first three numbers must match the vendored CUI.
name: publish-to-pypi

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  sdist:
    name: sdist
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install the source tools
        run: python -m pip install build twine libclang

      - name: The tag, the version and the vendored CUI agree
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          tag=${GITHUB_REF_NAME#v}
          cui=$(sed -n 's/^#define CUI_VERSION_STRING "\(.*\)"/\1/p' CUI/include/cui/cui.h)
          echo "tag ${tag}, package ${version}, vendored CUI ${cui}"
          if [ "${tag}" != "${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the version ${version} in pyproject.toml"
            exit 1
          fi
          if [ "${version%.*}" != "${cui}" ]; then
            echo "::error::version ${version} does not start with the vendored CUI version ${cui}"
            exit 1
          fi

      - name: The generated API matches CUI's headers
        run: python tools/gen_cui.py --check

      - name: Build the sdist
        run: python -m build --sdist --outdir dist

      - name: Check the sdist metadata
        run: python -m twine check dist/*

      - name: The sdist builds a wheel
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev
          python -m pip wheel --no-deps --wheel-dir build/from-sdist dist/*.tar.gz
          ls -l build/from-sdist

      - uses: actions/upload-artifact@v7
        with:
          name: dist-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: wheels (${{ matrix.name }})
    needs: sdist
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # One job per native target: cibuildwheel builds the runner's own
          # architecture, so nothing is cross-compiled and every wheel is
          # tested where it was built.
          - { name: linux-x86_64, runner: ubuntu-24.04 }
          - { name: linux-aarch64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x86_64, runner: macos-15-intel }
          - { name: windows-amd64, runner: windows-2022 }
          - { name: windows-arm64, runner: windows-11-arm }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false

      # The action sets up the Python that runs cibuildwheel. The version is
      # pinned because a cibuildwheel minor release can add or drop builds.
      - uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *_i686 pp*"
          CIBW_ARCHS: auto
          # The generated API check needs libclang and the CUI headers, so it
          # runs with the sdist; a wheel only has to import, render and run.
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: >-
            python -m pytest {project}/tests -q
            --ignore={project}/tests/test_generated.py

      - uses: actions/upload-artifact@v7
        with:
          name: dist-wheels-${{ matrix.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: publish
    needs: [sdist, wheels]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Replace the token with Trusted Publishing (id-token: write) if the
    # project gets a PyPI trusted publisher; attestations also need it.
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: The upload set is the tag's version
        run: |
          version=${GITHUB_REF_NAME#v}
          test "$(ls dist/*.tar.gz | wc -l)" -eq 1
          test "$(ls dist/*.whl | wc -l)" -gt 0
          for file in dist/*; do
            case "$(basename "${file}")" in
              *"-${version}-"*|*"-${version}.tar.gz") ;;
              *) echo "::error::$(basename "${file}") does not carry version ${version}"; exit 1 ;;
            esac
          done
          ls -l dist

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A PyPI API token for this project, kept in the repository's
          # secrets or in the pypi environment's secrets.
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          # A retry after a partial upload should finish the job instead of
          # failing on the files that already landed.
          skip-existing: true
          attestations: false
