# PYCUI CI: the generated API must be in sync with CUI's headers, the extension
# must build, and the offscreen test suite must pass.
#
# libclang is pinned: its parse drives the checked-in generated API, so a new
# version is a deliberate regeneration, not a silent CI upgrade.
name: ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: python -m pip install cython scikit-build-core cmake pytest libclang==18.1.1

      - name: Generated API is up to date
        run: python tools/gen_cui.py --check

      - name: Build and install
        run: python -m pip install --no-build-isolation .

      - name: Test
        run: python -m pytest tests -q

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev
          python -m pip install cython scikit-build-core cmake ninja pytest libclang==18.1.1

      - name: Generated API is up to date
        run: python tools/gen_cui.py --check

      - name: Build and install
        run: python -m pip install --no-build-isolation .

      - name: Test
        run: python -m pytest tests -q
